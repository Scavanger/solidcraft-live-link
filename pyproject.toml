# Only for the tests: Blender installs the add-on from blender_manifest.toml.
[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
testpaths = ["tests"]
# A leaked socket or a thread that died shows as a warning; fail on it rather than flake later.
filterwarnings = ["error"]

[tool.ruff]
line-length = 140
target-version = "py311"  # Blender 4.2's Python

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
