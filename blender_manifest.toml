schema_version = "1.0.0"

id = "solidcraft_link"
version = "0.1.0"
name = "SolidCraft Live Link"
tagline = "Follow a SolidCraft design live, as clean quad-dominant meshes"
maintainer = "Lemontree-Softworks"
type = "add-on"
website = "https://github.com/Scavanger/solidcraft-live-link"

tags = ["Import-Export", "Modeling", "Mesh"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Receives the design from SolidCraft on this computer"
files = "Reads SolidCraft's port and token files to connect"

# What `blender --command extension build` leaves out of the release zip.
[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.*",
  "/dist/",
  "/tests/",
  "/pyproject.toml",
  "*.zip",
]
